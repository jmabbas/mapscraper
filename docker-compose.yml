services:
  scraper:
    build: .
    container_name: gmaps-scraper
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - COMBOS_PER_RUN=3
      - TARGET_PER_COMBO=25
      - BATCH_SIZE=5
      - BATCH_PAUSE_MS=3000
      - COMBO_PAUSE_MS=5000
      - PER_COMBO_MAX_DURATION_MS=240000
      - TOTAL_MAX_DURATION_MS=1080000
      - HEADLESS=true
    volumes:
      - ./input:/app/input:ro
      - ./data:/app/data
      - ./output:/app/output

  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: gmaps-n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - WEBHOOK_URL=http://localhost:5678/
      - GENERIC_TIMEZONE=America/New_York
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on:
      - scraper

volumes:
  n8n_data:
